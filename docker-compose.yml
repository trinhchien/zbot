name: reunion-bot

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: reunion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reunion}
      POSTGRES_DB: reunion
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reunion"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  adapter-telegram:
    build:
      context: .
      dockerfile: apps/adapter-telegram/Dockerfile
    restart: always
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  adapter-zalo:
    build:
      context: .
      dockerfile: apps/adapter-zalo/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - zalo-data:/data/zalo
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["full"]

  bot-core:
    build:
      context: .
      dockerfile: apps/bot-core/Dockerfile
    restart: always
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 768M

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    restart: always
    env_file: .env
    volumes:
      - backup-data:/backups
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  zalo-data:
  backup-data:
